language:
  -module-name:
    custom-language-pack-loader: '[核心]自定义插件语言加载器'
    installation-check: '[核心]安装完整性检查'
    modrinth-version-check: '[核心]Modrinth更新服务'
    papi-support: '[核心]PlaceHolderAPI交互支持'
    platform-patcher: '[核心]平台差异补丁'
    protocol-lib-injector: '[核心]ProtocolLib平台代理'
    version-log-viewer: '[核心]更新日志查看器'
  custom-block:
    give: '{global#success}成功获取 {#var} *1'
    give-failed: '{global#error}不存在名为 {#var} 的自定义方块。'
  global-vars:
    sys-info: "{#aqua}系统{#dark_aqua} > {#gray}"
    sys-warning: "{#yellow}系统{#dark_aqua} > {#gray}"
    sys-error: "{#red}系统{#dark_aqua} > {#gray}"
    sys-success: "{#green}系统{#dark_aqua} > {#gray}"
    sys-operation: "{#light-purple}系统{#dark_aqua} > {#gray}"
    hint: "{#gray}[{#white}!{#gray}]{#gray}"
    success: "{#gray}[{#green}!{#gray}]{#gray}"
    info: "{#gray}[{#aqua}!{#gray}]{#gray}"
    warning: "{#gray}[{#yellow}!{#gray}]{#gray}"
    error: "{#gray}[{#red}!{#gray}]{#gray}"
    operation: "{#gray}[{#light-purple}!{#gray}]{#gray}"
  command:
    exception: "{global#sys-error}语法有误，或执行该命令时出现了内部错误。"
    lack-permission: "{global#sys-error}很抱歉，你没有执行该命令的权限({#var})。"
    player-only: "{global#sys-error}该命令只允许玩家执行。"
    sync-commands: "{global#sys-operation}命令同步完成。"

    error-missing: "{global#error}语法有误: 在 {#var} 处缺少参数。"
    error-argument-type-int: "{global#error}语法有误: 在 {#var} 处应为整形，实际输入 {#var}。"
    error-argument-type-float: "{global#error}语法有误: 在 {#var} 处应为浮点，实际输入 {#var}。"
    error-argument-type-double: "{global#error}语法有误: 在 {#var} 处应为双精度浮点，实际输入 {#var}。"
    error-argument-type-enum: "{global#error}语法有误: 在 {#var} 处应为{#var}中的一个，实际输入 {#var}。"
    error-require-player: "{global#error}语法有误: 在 {#var} 处需要一个玩家，实际({#var})不存在。"
    error-argument-bound: "{global#error}语法有误: 在 {#var} 处数值应处于 {#var}-{#var} 区间内，实际为{#var}。"

    error-lack-permission: "{global#error}权限不足: 缺少权限 {#var}。"
    error-lack-any-permission: "{global#error}权限不足: 缺少 {#var} 中的任意一个权限。"
    error-lack-all-permission: "{global#error}权限不足: 缺少 {#var} 中的任意全部权限。"
    error-sender-is-not-player: "{global#error}目标错误: 您需要为一名玩家。"

    error-internal-exception: "{global#error}执行此命令时出现内部错误，查看控制台获得更多信息。"
  module:
    list: "{global#sys-operation}以下是全部模块: {#return}%s"
    enable-all: "{global#sys-operation}成功启用所有模块。"
    disable-all: "{global#sys-operation}成功关闭所有模块。"
    reload-all: "{global#sys-operation}成功重载所有模块。"
    enable: "{global#sys-operation}成功启用模块 {#var}。"
    disable: "{global#sys-operation}成功关闭模块 {#var}。"
    reload: "{global#sys-operation}成功重载模块 {#var}。"
    not-found: "{global#sys-error}未找到模块 {#var}。"
    internal-error: "{global#sys-error}操作模块 {#var} 时出现内部错误。"
    already-op: "{global#sys-error}模块 {#var} 已处于请求的状态。"
    blocked-internal: "{global#sys-error}你无法操作 [内建] 模块 {#var} , 因为这可能导致错误。"
  package:
    list: "{global#sys-operation}以下是全部扩展包: {#return}%s"
    enable-all: "{global#sys-operation}成功启用所有扩展包。"
    disable-all: "{global#sys-operation}成功关闭所有扩展包。"
    reload-all: "{global#sys-operation}成功重载所有扩展包。"
    enable: "{global#sys-operation}成功启用扩展包 {#var}。"
    disable: "{global#sys-operation}成功关闭扩展包 {#var}。"
    reload: "{global#sys-operation}成功重载扩展包 {#var}。"
    not-found: "{global#sys-error}未找到扩展包 {#var}。"
    internal-error: "{global#sys-error}操作扩展包 {#var} 时出现内部错误。"
    already-op: "{global#sys-error}扩展包 {#var} 已处于请求的状态。"
    blocked-internal: "{global#sys-error}你无法操作 [内建] 包 {#var} , 因为这可能导致错误。"
  config:
    reload-all: "{global#sys-operation}已重载所有配置文件。"
    restore-all: "{global#sys-operation}已重置所有配置文件。"
    sync-all: "{global#sys-operation}已同步所有配置文件。"
    reload: "{global#sys-operation}已重载配置文件 {#var}。"
    restore: "{global#sys-operation}已重置配置文件 {#var}。"
    sync: "{global#sys-operation}已同步配置文件 {#var}。"
  global-var:
    reload: "{global#sys-operation}成功重载全局变量。"
    restore: "{global#sys-operation}成功重置全局变量。"
    sync: "{global#sys-operation}成功同步全局变量。"
  language:
    restore-all: "{global#sys-operation}已重置所有语言文件。"
    reload-all: "{global#sys-operation}已重载所有语言文件。"
    sync-all: "{global#sys-operation}已同步所有语言文件。"
    restore: "{global#sys-operation}已重置语言文件 {#var}。"
    reload: "{global#sys-operation}已重载语言文件 {#var}。"
    sync: "{global#sys-operation}已同步语言文件 {#var}。"
  auth:
    password-set: "{global#sys-info}你的密码被设为 {#white}{#var}{#gray} ,请注意妥善保存。当然, 你可以用/password来改变它。"
  about:
    version: "{global#sys-info}当前版本: {#var}"
  reload:
    platform-unsupported: "{global#sys-error}当前的平台不支持重载，请 {#gold}/reload{#white}"
    fastboot-unsupported: "{global#sys-error}FastBoot(快速启动)不支持重载，请 {#gold}/reload{#gray} 或关闭FastBoot。"
    complete: "{global#sys-operation}成功重载 Starlight 及全部已注册拓展包。"
    prepared: "{global#sys-operation}已进入重载预位，jar文件锁已释放以允许替换操作。完成后请使用 /starlight reload action 激活热更新。"
    reload-logic-updated: "{global#sys-operation}由于核心组件变化，现在你需要先用 /starlight reload prepare 进入重载预位。"
  folia-compat:
    disabled: "{global#sys-error}该功能因为Folia无相应兼容API以无法使用。"
    reload-warn: "{global#sys-error}Folia的重载会导致所有插件和命令无法正常加载, 你应该重启服务器!"
  version-log-viewer:
    view: "{global#sys-info}以下是 Starlight 版本 {#var} 的更新日志:"
    not-found: "{global#sys-error}未找到 Starlight 版本 {#var} 的更新日志。"
  locale:
    set: "{global#sys-info}你的服务端语言已被设为 {#var}, 部分显示可能需要重进才能更新。"
    preset: "{global#sys-info}检测到您的语言为 {#var}. 如语言错误, 请使用{#gold}/locale [语言]{#gray}进行选择。"
  modrinth-version-check:
    require: "{global#sys-info}有新的版本 {#var}, {click(link,%s)}{#white}[{#green}查看{#white}]{;}"
    no-require: "{global#sys-info}您的版本已经为最新版 {#var}，无需进行更新。"
    exception: "{global#sys-info}检查版本时出现错误，请查看控制台。"
    checking: "{global#sys-info}正在检查版本..."
  data-update:
    start: "{global#sys-info}已开始对项目{#var}进行数据导入升级, 请留意控制台信息。"
    none: "{global#sys-error}未找到{#var}相关的数据导入项。"
    done: "{global#sys-info}数据导入完成。"
  libraries:
    list: '{#aqua}已加载的第三方依赖库: '
    list-item: "{color(#44FFAA)}[%s]"
    list-hover: |-
      {color(#44FFAA)} %s
      {#gray}文件名称: {#white}%s
      {#gray}文件大小: {#white}%s KiB
      {#gray}下载日期: {#white}%s
      {#gray}完整路径: {#white}%s
  ban-service:
    default-line:
      - '{#gray}你已被 {#var} 因 {#var} 封禁。'
      - '{#gray}你的封禁将在 {#var} 结束。'
    default-kick-line: '{#gray}你已被踢出游戏: {#var}'
