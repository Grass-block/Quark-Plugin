  item-drop-secure:
    warn: "{global#warning}由于安全原因你无法丢掉这个物品, 使用{#gold}/unlock-drop{#gray} 或 {click(command,/unlock-drop)}{#white}[{#green}点击{#white}]{;} {#gray}来临时解锁。"
    unlock: "{global#info}你已解除物品丢弃安全锁。锁定将于{#var}秒后恢复。"
    unlock-end: "{global#info}物品丢弃安全锁已经恢复。"
  vein-miner:
    tip: "{#gray}潜行挖掘可以一次采集相连放置的矿石，木头和树叶，当然，这也会消耗更多耐久。"
